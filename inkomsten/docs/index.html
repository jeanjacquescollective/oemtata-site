<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oemtata inkomsten</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><rect x='7' y='16' width='4' height='9' rx='1.5' fill='white'/><rect x='14' y='10' width='4' height='15' rx='1.5' fill='white'/><rect x='21' y='6' width='4' height='19' rx='1.5' fill='white'/></svg>">
<link rel="stylesheet" href="style.css?v=67194ce96e">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div>
      <h1>Oemtata</h1>
      <p class="sub" id="updated">Inkomsten via de betaalterminal</p>
    </div>
    <button class="btn ghost" id="lockBtn" type="button" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 1 1 6 0v3H9Z"/></svg>
      <span>Vergrendel</span>
    </button>
  </div>
</header>

<section class="wrap lock" id="lockScreen">
  <form class="lock-card" id="pinForm">
    <h2>Code ingeven</h2>
    <p class="hint">Deze pagina is beveiligd.</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" required aria-label="Code" autofocus>
    <p class="err" id="pinErr" role="alert"></p>
    <button class="btn" type="submit" id="pinOk">Open</button>
  </form>
</section>

<main class="wrap" id="app" hidden>
  <section class="filters" aria-label="Instellingen">
    <label>Periode
      <select id="preset">
        <option value="thisWeek">Deze week</option>
        <option value="lastWeek">Vorige week</option>
        <option value="last4w">Laatste 4 weken</option>
        <option value="thisMonth">Deze maand</option>
        <option value="lastMonth">Vorige maand</option>
        <option value="last3m" selected>Laatste 3 maanden</option>
        <option value="thisYear">Dit jaar</option>
        <option value="last12m">Laatste 12 maanden</option>
        <option value="all">Alles</option>
        <option value="custom">Aangepast…</option>
      </select>
    </label>
    <label>Van <input type="date" id="from"></label>
    <label>Tot <input type="date" id="to"></label>
    <label>Per
      <select id="group">
        <option value="day">Dag</option>
        <option value="week" selected>Week</option>
        <option value="month">Maand</option>
        <option value="quarter">Kwartaal</option>
        <option value="year">Jaar</option>
      </select>
    </label>
    <label>Toon
      <select id="metric">
        <option value="cents">Omzet</option>
        <option value="count">Aantal betalingen</option>
        <option value="avg">Gem. bedrag</option>
      </select>
    </label>
    <div class="seg" role="group" aria-label="Grafiektype">
      <button type="button" data-type="bar" class="on">Staaf</button>
      <button type="button" data-type="line">Lijn</button>
    </div>
    <label class="check"><input type="checkbox" id="compare"> Vergelijk met vorige periode</label>
  </section>

  <section class="kpis" id="kpis"></section>

  <section class="card">
    <div class="card-head">
      <h2 id="chartTitle">Omzet per week</h2>
      <button class="link" type="button" id="tableToggle">Toon tabel</button>
    </div>
    <div class="chart-box tall"><canvas id="mainChart" aria-label="Hoofdgrafiek" role="img"></canvas></div>
    <div class="table-wrap" id="mainTable" hidden></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Gemiddelde per weekdag</h2>
      <span class="hint">alleen dagen met betalingen</span>
    </div>
    <div class="chart-box"><canvas id="weekdayChart" aria-label="Gemiddelde per weekdag" role="img"></canvas></div>
  </section>

  <!-- Beschermd gedeelte -->
  <section id="detail">
    <div class="detail-head">
      <h2>Details</h2>
    </div>
    <section class="kpis" id="detailKpis"></section>
    <div class="grid2">
      <section class="card">
        <div class="card-head"><h2>Omzet per uur</h2><span class="hint">cafédag van 06:00 tot 06:00</span></div>
        <div class="chart-box"><canvas id="hourChart" aria-label="Omzet per uur" role="img"></canvas></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Per kaartmerk</h2></div>
        <div class="chart-box"><canvas id="brandChart" aria-label="Omzet per kaartmerk" role="img"></canvas></div>
      </section>
    </div>
    <section class="card">
      <div class="card-head">
        <h2>Transacties</h2>
        <div class="row">
          <label>Dag <select id="txDay"></select></label>
          <button class="btn ghost" type="button" id="csvBtn">Download CSV</button>
        </div>
      </div>
      <div class="table-wrap" id="txTable"></div>
    </section>
  </section>
</main>


<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js?v=7e1e89e56c"></script>
</body>
</html>
